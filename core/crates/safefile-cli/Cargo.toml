[package]
name = "safefile-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SafeFile 命令行验证工具（Phase 2：先验证加密核心，再接 Flutter）"

[[bin]]
name = "safefile"
path = "src/main.rs"

[dependencies]
safefile-core = { path = "../safefile-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
