[workspace]
resolver = "2"
members = [
    "crates/safefile-core",
    "crates/safefile-cli",
    "crates/safefile-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
