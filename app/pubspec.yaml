name: safefile
description: "SafeFile — 跨平台本地文件加密、解密与预览工具（Windows / Android）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  file_selector: ^1.0.3
  desktop_drop:
    path: plugins/desktop_drop
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  permission_handler: 11.4.0
  video_player: ^2.14.1
  video_player_win: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
